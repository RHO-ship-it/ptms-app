{% extends "base.html" %}
{% block title %}Profil{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-person-circle"></i> Mon profil</h3>
<div class="card card-kpi p-4" style="max-width:500px;">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Nom d'utilisateur</label>
            <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
        </div>
        <div class="mb-3">
            <label class="form-label">Nom complet</label>
            <input type="text" class="form-control" name="full_name" value="{{ current_user.full_name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" value="{{ current_user.email }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Rôle</label>
            <input type="text" class="form-control" value="{{ current_user.role }}" disabled>
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a href="{{ url_for('auth.change_password') }}" class="btn btn-outline-secondary">Changer le mot de passe</a>
    </form>
</div>
{% endblock %}
