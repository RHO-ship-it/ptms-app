{% extends "base.html" %}
{% block title %}{{ 'Modifier' if lab else 'Nouveau' }} laboratoire{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-building"></i> {{ 'Modifier le laboratoire' if lab else 'Nouveau laboratoire' }}</h3>
<div class="card card-kpi p-4" style="max-width:600px;">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Code</label>
            <input type="text" class="form-control" name="code" value="{{ lab.code if lab else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nom</label>
            <input type="text" class="form-control" name="name" value="{{ lab.name if lab else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contact</label>
            <input type="text" class="form-control" name="contact_name" value="{{ lab.contact_name if lab else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" value="{{ lab.email if lab else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Téléphone</label>
            <input type="text" class="form-control" name="phone" value="{{ lab.phone if lab else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Adresse</label>
            <textarea class="form-control" name="address" rows="2">{{ lab.address if lab else '' }}</textarea>
        </div>
        {% if lab %}
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" name="active" id="active" {{ 'checked' if lab.active }}>
            <label class="form-check-label" for="active">Laboratoire actif</label>
        </div>
        {% endif %}
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a href="{{ url_for('laboratories.list_labs') }}" class="btn btn-outline-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
