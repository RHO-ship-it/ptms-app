{% extends "base.html" %}
{% block title %}Protocole statistique{% endblock %}
{% block content %}
<div class="container-fluid px-4 py-4" style="max-width:1100px;">
  <h3 class="fw-bold mb-3"><i class="bi bi-bar-chart-line-fill text-primary me-2"></i>Protocole statistique</h3>

  {% for d in documents %}
  <div class="card shadow-sm mb-4" style="border-radius:14px;overflow:hidden;">
    <div class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2">
      <span class="fw-bold"><i class="bi bi-file-earmark-pdf-fill text-danger me-2"></i>{{ d.title }}</span>
      <span class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-primary" target="_blank" rel="noopener" href="{{ url_for('catalogue.document', doc_id=d.id) }}"><i class="bi bi-box-arrow-up-right me-1"></i>Ouvrir</a>
        <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('catalogue.document', doc_id=d.id, download=1) }}"><i class="bi bi-download me-1"></i>Télécharger</a>
      </span>
    </div>
    <iframe src="{{ url_for('catalogue.document', doc_id=d.id) }}" title="{{ d.title }}" style="width:100%;height:80vh;border:0;"></iframe>
  </div>
  {% else %}
  <div class="text-center text-muted p-5 border rounded-3"><i class="bi bi-file-earmark-pdf fs-1 d-block mb-2"></i>Le protocole n'est pas encore disponible.</div>
  {% endfor %}
</div>
{% endblock %}
