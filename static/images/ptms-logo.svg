<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" role="img" aria-labelledby="title desc">
  <title id="title">PTTS</title>
  <desc id="desc">PTTS logo with tagline Join TTS for Proficiency Testing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="50%" stop-color="#0D4DBA"/>
      <stop offset="100%" stop-color="#0AA9E6"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="200" height="200" rx="42" fill="url(#bg)"/>
  <rect x="26" y="26" width="168" height="168" rx="30" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <text x="110" y="122" text-anchor="middle" font-size="58" font-weight="900" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.5">PTTS</text>
  <rect x="58" y="142" width="104" height="8" rx="4" fill="#7DD3FC"/>

  <text x="236" y="110" font-size="30" font-weight="800" fill="#0B1F3A" font-family="Segoe UI, Arial, sans-serif">Join TTS</text>
  <text x="236" y="146" font-size="24" font-weight="600" fill="#475569" font-family="Segoe UI, Arial, sans-serif">for Proficiency Testing</text>
  <rect x="236" y="164" width="280" height="4" fill="#38BDF8"/>
</svg>
