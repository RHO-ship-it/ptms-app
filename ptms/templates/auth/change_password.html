{% extends "base.html" %}
{% block title %}Changer le mot de passe{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-key"></i> Changer le mot de passe</h3>
<div class="card card-kpi p-4" style="max-width:500px;">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Mot de passe actuel</label>
            <input type="password" class="form-control" name="current_password" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nouveau mot de passe</label>
            <input type="password" class="form-control" name="new_password" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Confirmer le nouveau mot de passe</label>
            <input type="password" class="form-control" name="confirm_password" required>
        </div>
        <button type="submit" class="btn btn-primary">Modifier</button>
        <a href="{{ url_for('auth.profile') }}" class="btn btn-outline-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
