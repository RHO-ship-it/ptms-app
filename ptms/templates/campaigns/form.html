{% extends "base.html" %}
{% block title %}{{ 'Modifier' if campaign else 'Nouvelle' }} campagne{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-flag"></i> {{ 'Modifier la campagne' if campaign else 'Nouvelle campagne' }}</h3>
<div class="card card-kpi p-4" style="max-width:600px;">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Référence</label>
            <input type="text" class="form-control" name="reference" value="{{ campaign.reference if campaign else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nom</label>
            <input type="text" class="form-control" name="name" value="{{ campaign.name if campaign else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="3">{{ campaign.description if campaign else '' }}</textarea>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Date de début</label>
                <input type="date" class="form-control" name="start_date" value="{{ campaign.start_date if campaign and campaign.start_date else '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Date de fin</label>
                <input type="date" class="form-control" name="end_date" value="{{ campaign.end_date if campaign and campaign.end_date else '' }}">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a href="{{ url_for('campaigns.list_campaigns') }}" class="btn btn-outline-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
